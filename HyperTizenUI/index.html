<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperTizen+</title>
  <link rel="stylesheet" href="main.css">
</head>
<body data-level="idle">
  <div class="glow" aria-hidden="true"></div>

  <main>
    <header>
      <div class="brand">
        <img src="icon.png" alt="" width="64" height="64">
        <h1>HyperTizen</h1>
      </div>
      <p class="meta" id="meta">Pornire…</p>
    </header>

    <section class="verdict" aria-live="polite">
      <h2 id="vTitle">Pornire…</h2>
      <p id="vDetail"></p>
    </section>

    <section class="chain" aria-label="Starea fiecărei etape">
      <div class="node" id="n0"><h3>Serviciu TV</h3><p class="st"></p><p class="dt"></p></div>
      <div class="link" aria-hidden="true"></div>
      <div class="node" id="n1"><h3>Server Hyperion</h3><p class="st"></p><p class="dt"></p></div>
      <div class="link" aria-hidden="true"></div>
      <div class="node" id="n2"><h3>Legătura TV către PC</h3><p class="st"></p><p class="dt"></p></div>
      <div class="link" aria-hidden="true"></div>
      <div class="node" id="n3"><h3>Imagine primită</h3><p class="st"></p><p class="dt"></p></div>
    </section>

    <div class="cols">
      <section class="panel">
        <h3>Server Hyperion</h3>
        <p class="line" id="rpcLine"></p>
        <div class="devices" id="devices"></div>
        <div class="actions">
          <button type="button" id="btnScan">Caută din nou</button>
          <button type="button" id="btnTest">Testează legătura</button>
        </div>
      </section>

      <section class="panel">
        <h3>Captură</h3>
        <p class="line" id="capLine"></p>
        <div class="actions">
          <button type="button" id="btnCap" class="primary">Pornește captura</button>
          <button type="button" id="btnReload">Reîncarcă interfața</button>
        </div>
      </section>
    </div>

    <section class="panel logpanel">
      <h3>Jurnal</h3>
      <pre id="log" aria-live="off"></pre>
      <div class="actions"><button type="button" id="btnLog">Arată mai mult</button></div>
    </section>
  </main>

  <div id="toast" role="status"></div>

  <script src="js/app.js"></script>
  <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
</body>
</html>
